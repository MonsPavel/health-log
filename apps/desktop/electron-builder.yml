# TASK-034 §5/§6: electron-builder — Windows-сборка (NSIS, x64) и запуск packaged.
#
# Артефакты (§20): «Health Log Setup <version>.exe» + win-unpacked в dist/ (§24:
# размер проверяет scripts/check-size.mjs — последний шаг скрипта dist).
#
# userData (§8/§20): %APPDATA%/health-log/ — basename БЕЗ пробела (PHI-правило путей).
# Electron берёт имя приложения из productName упакованного package.json, поэтому
# extraMetadata пишет туда productName: health-log; productName выше («Health Log»)
# остаётся именем exe/ярлыков/установщика. Проверено логом packaged-запуска
# (userData/logs/hl.1.log: app started, dev:false).
appId: dev.healthlog.app
productName: Health Log
extraMetadata:
  productName: health-log

# §5: asar on; рендерер грузится через file:// из asar (base './' — vite.config.ts).
asar: true
# §22 (риск asar+native): нативный модуль не грузится из asar — распаковка по glob
# **/*.node (smart-unpack выносит пакет better-sqlite3-multiple-ciphers в app.asar.unpacked).
# Урок прогона 4 живой приёмки TASK-105 §20: бинари llama грузятся LoadLibrary
# из соседнего каталога (asar не читается) — CPU-пакет llama целиком в unpacked.
asarUnpack:
  - '**/*.node'
  - 'node_modules/@node-llama-cpp/win-x64/**'

# §5: только собранные бандлы (+ package.json и prod-зависимости electron-builder
# собирает сам; workspace @hl/kernel и @hl/contracts подтягиваются как prod-deps
# вместе со своими dist). §14: исходники проекта в состав не входят — исключаем src/
# workspace-пакетов (их тесты — тоже там); src сторонних npm-пакетов — содержимое
# их официальных tarball'ов, как у любого Electron-приложения.
# TASK-079: манифест моделей — внутрь asar (§9 079: чтение ресурса по корню
# приложения — app.getAppPath()/дефолтный резолв сквозь asar); САМИ файлы
# моделей в установщик не входят (арх. 10 §2 — см. extraResources ниже).
#
# Урок прогона 4 живой приёмки TASK-105 §20 (гейт check-size, NFR-5/D1a
# ≤200 МБ): pnpm ставит все win-платформенные пакеты node-llama-cpp, и без
# фильтра в установщик попадают CUDA+CUDA-ext+Vulkan+arm64 — 602 МБ сырых
# (установщик 404.5 МБ > 200). MVP-инференс — CPU (целевые перфы TASK-077
# посчитаны на CPU; getLlama без GPU-бэкендов тихо берёт CPU) → CPU-only:
# исключаем все GPU/arm64-варианты. GPU-сборки — post-MVP, отдельным
# артефактом при появлении критерия (отчёт D1a в tools/scripts/size-audit).
files:
  - dist/main
  - dist-renderer
  - resources/models-manifest.json
  - '!node_modules/@hl/kernel/src'
  - '!node_modules/@hl/contracts/src'
  - '!node_modules/@node-llama-cpp/win-x64-cuda/**'
  - '!node_modules/@node-llama-cpp/win-x64-cuda-ext/**'
  - '!node_modules/@node-llama-cpp/win-x64-vulkan/**'
  - '!node_modules/@node-llama-cpp/win-arm64/**'

# §5: файлы моделей — вне установщика (арх. 10 §2), поэтому extraResources пусто;
# манифест моделей с TASK-079 идёт внутрь asar (files выше, §9 079).
extraResources: []

# Нативный стек better-sqlite3-multiple-ciphers — prebuilt Node-API, бинарь уже в пакете
# (ADR-0002: «один бинарник для node и Electron ≥35», совместимость проверяет
# scripts/prepare-native.sh — postinstall/§19). Пересборка node-gyp не нужна и невозможна
# в окружении без VS Build Tools — отключаем штатный rebuild electron-builder.
npmRebuild: false

# TASK-104 §5: update feed — generic-провайдер поверх permalink «latest» GitHub Releases.
# TASK-107 §5: ДВЕ записи publish — «один артефакт, разные фиды» (решение §5):
# каждая сборка кладёт в дистрибутив ОБА канальных файла (computeChannelNames —
# по записи: stable.yml и beta.yml; release.yml 105 attach'ит dist/*.yml к draft).
# app-update.yml в приложении собирается из ПЕРВОЙ записи (PublishManager.
# getAppUpdatePublishConfiguration → publishConfigs[0]): канал stable +
# publisherName (NFR-11 не ослабляется, §14 107 — подпись артефактов идентична).
# Вторая запись даёт beta.yml артефакта: пре-релизный тег vX.Y.Z-beta.N/-rc.N
# уходит в beta-фид (β-клиенты — updater.channel=beta, TASK-107); у stable-сборки
# beta.yml = той же стабильной версии — beta-клиент не отстаёт от stable.
# publisherName во второй записи не дублируется (конфиг-тест считает вхождения).
publish:
  - provider: generic
    url: https://github.com/MonsPavel/health-log/releases/latest/download
    channel: stable
    # Схема app-builder-lib: в publish publisherName — ТОЛЬКО массив строк
    # (в win.signtoolOptions допустим скаляр). Значения обязаны совпадать —
    # проверяет конфиг-тест update-feed.test.ts.
    publisherName:
      - CN=Health Log, O=Health Log, C=RU
  - provider: generic
    url: https://github.com/MonsPavel/health-log/releases/latest/download
    channel: beta

win:
  target:
    - target: nsis
      arch:
        - x64
  # §5/§6: dev-иконка-заглушка (генератор — 256×256, минимум electron-builder для win);
  # брендовые иконки — post-MVP (§5 «Не включено»).
  icon: build/icon-dev.ico
  # TASK-104 §5: signtool-конфиг подписи (секреты — НЕ здесь: pfx через env
  # WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD — GitHub Secrets в CI, локально env-файл вне git,
  # см. certificates.md; без env сборка продолжается unsigned, как в TASK-034).
  # rfc3161TimeStampServer ОБЯЗАТЕЛЕН (§13): подпись переживает истечение сертификата.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
    publisherName: CN=Health Log, O=Health Log, C=RU

nsis:
  # §5/§20: per-user установка без прав администратора, с выбором каталога
  # (не one-click). Автообновление (TASK-096) — вне задачи; подпись — TASK-104
  # (win.signtoolOptions выше): SmartScreen первые недели OV — известное
  # ограничение (§14, коммуникация в release notes — 114).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
